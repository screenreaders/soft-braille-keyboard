import java.util.Properties

plugins {
    id("com.android.application")
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def releaseStoreFile = (keystoreProperties.getProperty("storeFile")
        ?: System.getenv("SBK_RELEASE_STORE_FILE"))
def releaseStorePassword = (keystoreProperties.getProperty("storePassword")
        ?: System.getenv("SBK_RELEASE_STORE_PASSWORD"))
def releaseKeyAlias = (keystoreProperties.getProperty("keyAlias")
        ?: System.getenv("SBK_RELEASE_KEY_ALIAS"))
def releaseKeyPassword = (keystoreProperties.getProperty("keyPassword")
        ?: System.getenv("SBK_RELEASE_KEY_PASSWORD"))
def hasReleaseSigning = [releaseStoreFile, releaseStorePassword,
        releaseKeyAlias, releaseKeyPassword].every { value ->
    value != null && !value.trim().isEmpty()
}
def releaseStoreFilePath = releaseStoreFile ? rootProject.file(releaseStoreFile) : null

android {
    namespace "com.dalton.braillekeyboard"
    compileSdk 36
    ndkVersion "27.1.12297006"

    defaultConfig {
        applicationId "com.dalton.braillekeyboard"
        minSdk 21
        targetSdk 36
        versionCode 57
        versionName "3.1.1"
    }

    sourceSets {
        main {
            manifest.srcFile "src/main/AndroidManifest.xml"
            java.srcDirs = ["../src", "src/main/java"]
            aidl.srcDirs = ["src/main/aidl"]
            res.srcDirs = ["../res", "src/main/res"]
            assets.srcDirs = ["src/main/assets"]
            jni.srcDirs = []
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    externalNativeBuild {
        ndkBuild {
            path file("src/main/jni/Android.mk")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseStoreFilePath
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    testImplementation "junit:junit:4.13.2"
}
